<title>خرجة · الإدارة</title>
<style>
:root{--bg:#FAF7F2;--surface:#fff;--ink:#171717;--border:#E8E1D6;--border-input:#8A8174;--text:#171717;--muted:#5C554D;--accent:#075BFF;--accent-text:#0647D8;--on-accent:#fff;--pop:#56A0FF;--mint:#C9DDFF;--price:#075BFF;--warn:#8A4B00;--danger:#C4001A;--success:#0E7C4A;--soft:#FDEBDD;--r:16px}
:root[data-theme="dark"]{--bg:#14110F;--surface:#1F1B18;--border:#38312C;--border-input:#9B9084;--text:#F6F1EA;--muted:#B9AEA2;--accent:#075BFF;--accent-text:#9CC4FF;--on-accent:#1C0F05;--price:#5EEAD4;--warn:#FBBF24;--danger:#FF9A9A;--success:#6CE9A6;--soft:#3A2417}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110F;--surface:#1F1B18;--border:#38312C;--border-input:#9B9084;--text:#F6F1EA;--muted:#B9AEA2;--accent:#075BFF;--accent-text:#9CC4FF;--on-accent:#1C0F05;--price:#5EEAD4;--warn:#FBBF24;--danger:#FF9A9A;--success:#6CE9A6;--soft:#3A2417}}
[hidden]{display:none!important}*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-lat);font-size:15px;line-height:1.7;font-weight:500}
:lang(ar) *{letter-spacing:0!important}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
a{color:var(--accent-text)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--border-input);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ok{background:var(--success);color:#fff;border-color:transparent}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,select,textarea{min-height:44px;border-radius:12px;border:1.5px solid var(--border-input);background:var(--surface);padding:8px 12px;width:100%}
label.f{display:grid;gap:6px;font-weight:600;margin-bottom:12px}
/* login */
#login{max-width:380px;margin:12vh auto;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:20px}
#login h1{margin:0 0 4px;font-size:24px}#login p{margin:0 0 20px;color:var(--muted)}
.err{color:var(--danger);font-weight:600;min-height:24px;margin:4px 0}
/* shell */
#shell{display:grid;grid-template-columns:230px 1fr;min-height:100dvh}
aside{background:var(--surface);border-inline-end:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh}
aside h2{margin:0 8px 14px;font-size:20px}
aside a.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:600}
aside a.nav[aria-current=page]{background:var(--soft);color:var(--accent-text)}
aside .sp{flex:1}
.ic{width:20px;height:20px;flex:none}
main{padding:28px 32px;min-width:0}
main h1{margin:0 0 20px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stat b{display:block;font-size:30px;line-height:1.2}.stat span{color:var(--muted);font-size:14px}
.stat.hot b{color:var(--accent-text)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar .input{width:auto;min-width:220px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);font-weight:600}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}tr:last-child td{border:0}
tbody tr[data-open]{cursor:pointer}tbody tr[data-open]:hover{background:var(--soft)}
.badge{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:12px;background:var(--soft);color:var(--text);white-space:nowrap}
.badge.approved,.badge.completed,.badge.closed{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.badge.rejected,.badge.cancelled,.badge.suspended,.badge.open{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.badge.pending,.badge.reviewing,.badge.in_progress,.badge.en_route,.badge.arrived{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--text)}
.badge.incomplete{background:var(--border);color:var(--muted)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.back{display:inline-flex;gap:6px;align-items:center;margin-bottom:14px;background:none;border:0;color:var(--accent-text);font-weight:700;min-height:40px;padding:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:17px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.docc{border:1px solid var(--border);border-radius:var(--r);padding:12px;background:var(--surface)}
.docc img{width:100%;height:190px;object-fit:cover;border-radius:10px;background:var(--soft);display:block;cursor:zoom-in;border:1px solid var(--border)}
.docc .miss{height:190px;border-radius:10px;border:1.5px dashed var(--border-input);display:grid;place-items:center;color:var(--muted)}
.docc h4{margin:10px 0 4px;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.docc .meta{font-size:13px;color:var(--muted);margin:0 0 8px}.docc .why{color:var(--danger);font-size:13px;font-weight:600;margin:0 0 8px}
.docc .acts{display:flex;gap:8px;flex-wrap:wrap}.docc .acts .btn{min-height:40px;padding:0 14px;font-size:14px}
dialog{border:0;border-radius:18px;padding:22px;max-width:min(560px,92vw);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog.img{max-width:94vw;padding:12px;background:#000}dialog.img img{max-width:90vw;max-height:84vh;display:block;border-radius:10px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translate(-50%,40px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:24px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tl{list-style:none;margin:0;padding:0}.tl li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}.tl li:last-child{border:0}
@media(max-width:820px){#shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}aside h2{display:none}aside .sp{display:none}main{padding:18px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

h1,main h1{font-weight:700}
.btn{border:1.5px solid var(--border);font-weight:700;box-shadow:none}.btn:active{transform:scale(.98)}
.btn.primary{border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.ok{background:var(--success);color:#fff;border:0}.btn.danger{background:var(--surface);color:var(--danger);border-color:var(--danger)}
.input,select,textarea{border:1.5px solid var(--border)}
#login{border:0;box-shadow:0 20px 60px rgba(15,27,61,.18);background:var(--surface)}
body{background:var(--bg)}
aside{background:var(--accent);border:0;color:#fff}aside h2{color:#fff;font-weight:700}
aside a.nav{color:#fff;opacity:.9}aside a.nav[aria-current=page]{background:#fff;color:var(--accent);opacity:1}
aside .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}#who{color:#DCE5FF!important}
.stat{border:0;box-shadow:0 4px 16px rgba(15,27,61,.08)}.stat b{font-weight:700;color:var(--accent-text)}.stat.hot b{color:var(--danger)}
.tablewrap,.card,.docc{border:0;box-shadow:0 4px 16px rgba(15,27,61,.08)}
th{background:var(--soft);color:var(--text)}
.tabs button{border:1.5px solid var(--border);font-weight:600}.tabs button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.badge{color:var(--text)}.badge.approved,.badge.completed,.badge.closed{background:color-mix(in srgb,var(--mint) 35%,var(--surface));color:var(--price)}
.badge.rejected,.badge.cancelled,.badge.suspended,.badge.open{background:#FDE2E2;color:#7A0010}
.badge.pending,.badge.reviewing,.badge.in_progress,.badge.en_route,.badge.arrived{background:#FFF3CD;color:#5C3D00}
tbody tr[data-open]:hover{background:var(--soft)}

/* ===== Step 4: Kherja teal glass skin, compact controls, motion ===== */
:root{--bg:#EEF1F3;--accent:#5B4BDB;--accent-text:#5B4BDB;--on-accent:#fff;--soft:#E3F1EF;--price:#5B4BDB;--glassb:rgba(255,255,255,.62)}
:root[data-theme="dark"]{--bg:#0F1415;--surface:#182022;--border:#2A3639;--accent:#2DD4BF;--accent-text:#5EEAD4;--on-accent:#04302B;--soft:#12302C;--price:#5EEAD4;--glassb:rgba(24,32,34,.66);--text:#EAF1EF;--muted:#A9B8B5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1415;--surface:#182022;--border:#2A3639;--accent:#2DD4BF;--accent-text:#5EEAD4;--on-accent:#04302B;--soft:#12302C;--price:#5EEAD4;--glassb:rgba(24,32,34,.66);--text:#EAF1EF;--muted:#A9B8B5}}
body{background:radial-gradient(60% 38% at 92% 0,rgba(45,212,191,.20),transparent 62%),radial-gradient(50% 30% at 0 100%,rgba(91,75,219,.12),transparent 60%),var(--bg)}
aside{background:linear-gradient(180deg,#134E4A,#0F3B38);color:#fff}
:root[data-theme="dark"] aside{background:linear-gradient(180deg,#12302C,#0E1F20)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) aside{background:linear-gradient(180deg,#12302C,#0E1F20)}}
aside a.nav[aria-current=page]{background:rgba(255,255,255,.94);color:#0F5F59}
aside a.nav{font-size:14px;min-height:40px;transition:background .18s,transform .18s}
aside a.nav:hover{background:rgba(255,255,255,.12)}aside a.nav[aria-current=page]:hover{background:#fff}
aside a.nav .ic{width:18px;height:18px;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
aside a.nav:hover .ic{transform:translateY(-1px) scale(1.12)}aside a.nav[aria-current=page] .ic{animation:icpop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes icpop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.card,.stat,.tablewrap,.docc{background:var(--glassb);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid color-mix(in srgb,var(--text) 9%,transparent);box-shadow:0 6px 22px -10px rgba(15,60,56,.25)}
@media (prefers-reduced-transparency:reduce){.card,.stat,.tablewrap,.docc{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}}
.btn{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px;transition:transform .12s,box-shadow .18s,background .18s}
.btn:active:not([disabled]){transform:scale(.96)}.btn[disabled]{opacity:.5}.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.ok{background:var(--accent);color:var(--on-accent)}
.btn.busy{position:relative;color:transparent!important}.btn.busy::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--on-accent);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stat b{font-size:26px;color:var(--accent-text)}.stat.hot b{color:var(--danger)}
.badge.approved,.badge.completed,.badge.closed{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text)}
main.enter{animation:pgin .2s ease-out}@keyframes pgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
dialog{backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);background:var(--glassb);border:1px solid color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
dialog[open]{animation:dlgin .2s ease-out}dialog[open]::backdrop{animation:fadein .2s}@keyframes dlgin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}@keyframes fadein{from{opacity:0}}
@media(max-width:820px){dialog.sheet{margin:auto 0 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;padding-bottom:max(22px,env(safe-area-inset-bottom))}dialog.sheet[open]{animation:sheetin .28s cubic-bezier(.2,.9,.3,1)}@keyframes sheetin{from{transform:translateY(100%)}}}
.chg{display:grid;gap:12px;margin-bottom:14px}.chg .hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.cmp{grid-template-columns:1fr}}
.cmp>div{border-radius:14px;padding:12px;background:color-mix(in srgb,var(--text) 5%,transparent)}.cmp h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:700}.cmp .v{font-weight:700}.cmp .new{background:var(--soft)}
.cmp .diff{color:var(--accent-text);text-decoration:underline;text-decoration-style:dotted}
.chg .meta{font-size:13px;color:var(--muted)}.chg .acts{display:flex;gap:8px;flex-wrap:wrap}
.spark{width:100%;height:90px}.spark path.l{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.spark path.a{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:none}
.note{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:12px;padding:8px 12px;font-size:13px;margin:0 0 14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.sw:last-child{border:0}.sw small{color:var(--muted);display:block}
.sw input[type=checkbox]{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--border-input);position:relative;transition:background .18s;flex:none}.sw input[type=checkbox]::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s}
.sw input[type=checkbox]:checked{background:var(--accent)}.sw input[type=checkbox]:checked::after{transform:translateX(18px)}[dir=rtl] .sw input[type=checkbox]:checked::after{transform:translateX(-18px)}.sw input:disabled{opacity:.4}
.lng{background:transparent;border:1.5px solid rgba(255,255,255,.5);color:#fff;min-height:34px}
@media(max-width:820px){aside{position:sticky;top:0;z-index:5;flex-wrap:nowrap;overflow-x:auto;align-items:center;gap:6px;scrollbar-width:none}aside::-webkit-scrollbar{display:none}aside a.nav,aside .btn{flex:none;white-space:nowrap;min-height:44px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  <label class="f"><span data-i="l_phone">رقم الهاتف</span><input class="input num" id="l-phone" inputmode="tel" autocomplete="username"></label>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(m,p,b)=>{const r=await fetch(p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined,credentials:'same-origin'});let j={};try{j=await r.json()}catch{}
  if(r.status===401&&!p.includes('/login')){show('login');throw Object.assign(new Error('auth'),{status:401})}
  if(!r.ok)throw Object.assign(new Error(j.error||r.status),{status:r.status});return j};

    try{await api('POST',`/api/admin/docs/${b.dataset.rev}/review`,{status:'approved'});toast(g('تم القبول'));render()}catch{toast(g('تعذّر الحفظ'))}});
  const s=$('#susp');if(s)s.onclick=async()=>{const to=+s.dataset.to;if(to&&!confirm(g('إيقاف هذا السائق؟')))return;try{await api('POST',`/api/admin/drivers/${s.dataset.id}/suspend`,{suspended:!!to});toast(to?'تم الإيقاف':'أُلغي الإيقاف');render()}catch{toast(g('تعذّر الحفظ'))}};
  const go=$('#r-go');if(go){const f=()=>{location.hash='#/rides/'+encodeURIComponent($('#r-q').value.trim());render()};go.onclick=f;$('#r-q').onkeydown=e=>{if(e.key==='Enter')f()};$('#r-st').onchange=f}
  $$('[data-rep]').forEach(sel=>sel.onchange=async()=>{try{await api('POST','/api/admin/reports/'+sel.dataset.rep,{status:sel.value});toast(g('تم الحفظ'))}catch{toast(g('تعذّر الحفظ'))}})}
$('#rej-form').onsubmit=async e=>{const v=e.submitter&&e.submitter.value;if(v!=='ok'){return}e.preventDefault();const reason=$('#rej-reason').value.trim();if(!reason)return;
  try{await api('POST',`/api/admin/docs/${revTarget}/review`,{status:'rejected',reason});$('#dlg-reject').close();toast(g('تم الرفض'));render()}catch{toast(g('تعذّر الحفظ'))}};
window.addEventListener('hashchange',render);applyLang();
async function start(){try{const me=await api('GET','/api/admin/me');$('#who').textContent=me.name||me.phone}catch{return}show('shell');render()}
start();
</script>
</body>
