workflows:
  kherja-android:
    name: KHERJA Android (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.23.4
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build KHERJA web assets
        script: |
          node app/build-shell.js
          node app/build-apps.js
          npm run mobile:preflight
      - name: Generate and sync Android project
        script: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build APK and AAB
        script: |
          cd android
          ./gradlew assembleDebug bundleRelease
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/bundle/release/*.aab

  kherja-ios:
    name: KHERJA iOS (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.23.4
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kherja.app
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build KHERJA web assets
        script: |
          node app/build-shell.js
          node app/build-apps.js
          npm run mobile:preflight
      - name: Generate and sync iOS project
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Configure code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
